apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.socialorganizer.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.socialorganizer.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 14
        versionName "2.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Hosts whose /invite/ links open the app (App Links, see AndroidManifest.xml)
        manifestPlaceholders = [appLinkHost: "www.orginizer.com", appLinkHostAlt: "orginizer.com"]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (keystorePropertiesFile.exists()) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        // Test build that wraps the Railway staging environment instead of production.
        // Debug-signed, installs next to the store app (own package id and name).
        // Build with: node scripts/build-android-staging.mjs
        staging {
            initWith debug
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            resValue "string", "app_name", "SO Staging"
            resValue "string", "title_activity_main", "SO Staging"
            // Staging invite links open SO Staging; orginizer.com links stay with the store app
            def stagingHost = new URI(project.findProperty('stagingUrl') ?: 'https://social-organizer-staging.up.railway.app').host
            manifestPlaceholders = [appLinkHost: stagingHost, appLinkHostAlt: stagingHost]
            matchingFallbacks = ['debug']
        }
    }
    sourceSets {
        staging {
            assets.srcDirs += ["$buildDir/generated/staging-assets"]
        }
    }
}

// The staging build overrides capacitor.config.json (written by `cap sync` into main assets)
// with a copy whose server.url points at staging. Build-type assets win over main.
def stagingUrl = project.findProperty('stagingUrl') ?: 'https://social-organizer-staging.up.railway.app'
def stagingAssetsDir = file("$buildDir/generated/staging-assets")
def mainCapConfig = file('src/main/assets/capacitor.config.json')

tasks.register('generateStagingCapacitorConfig') {
    inputs.file(mainCapConfig).optional()
    inputs.property('stagingUrl', stagingUrl)
    outputs.dir(stagingAssetsDir)
    doLast {
        if (!mainCapConfig.exists()) {
            throw new GradleException("capacitor.config.json not found in main assets. Run `npx cap sync android` first.")
        }
        def config = new groovy.json.JsonSlurper().parse(mainCapConfig)
        config.server = (config.server ?: [:]) + [url: stagingUrl]
        stagingAssetsDir.mkdirs()
        new File(stagingAssetsDir, 'capacitor.config.json').text =
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
    }
}

tasks.matching { it.name == 'mergeStagingAssets' }.configureEach {
    dependsOn 'generateStagingCapacitorConfig'
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.android.installreferrer:installreferrer:2.2'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сбор — экраны</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .who { display:flex; align-items:center; gap:12px; }
  .who .ava { width:48px; height:48px; border-radius:16px; background:var(--teal-soft); color:var(--teal); display:grid; place-items:center; font-weight:800; font-size:18px; flex:none; }
  .who .t b { display:block; font-size:22px; letter-spacing:-.03em; line-height:1.1; }
  .who .t span { display:block; margin-top:3px; color:var(--muted); font-size:13px; font-weight:600; }
  .who + .meter { margin-top:16px; }
  .joined { display:flex; align-items:center; gap:12px; }
  .joined .big { flex:1; }
  .joined .edit { height:40px; padding:0 14px; border-radius:12px; background:var(--canvas); color:var(--ink); font-weight:700; font-size:14px; display:grid; place-items:center; }
  .cycle { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; background:var(--warm-soft); color:var(--warm-ink); font-size:14px; line-height:1.35; }
  .cycle i { flex:none; width:36px; height:36px; border-radius:12px; background:var(--paper); color:var(--warm-ink); display:grid; place-items:center; }
  .cycle i svg { width:20px; height:20px; }
  .cycle b { font-weight:800; }
  .linkrow { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; background:var(--canvas); }
  .linkrow .t { flex:1; min-width:0; }
  .linkrow .t small { display:block; color:var(--muted); font-size:12px; font-weight:600; }
  .linkrow .t b { display:block; font-size:15px; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .linkrow svg { width:20px; height:20px; color:var(--teal); flex:none; }
  .two { display:grid; grid-template-columns:1fr 56px; gap:10px; margin-top:12px; }
  .two .btn + .btn { margin-top:0; }
  .two .btn.secondary svg { width:22px; height:22px; }
  .pub { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; padding:70px 20px 28px; text-align:center; }
  .pub .brand { display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; letter-spacing:-.02em; }
  .pub .brand img { width:26px; height:26px; border-radius:8px; }
  .pub .ava { width:84px; height:84px; border-radius:28px; background:var(--teal-soft); color:var(--teal); display:grid; place-items:center; font-weight:800; font-size:32px; margin-top:56px; }
  .pub h2 { margin:14px 0 0; font-size:28px; letter-spacing:-.04em; line-height:1.05; }
  .pub .why { margin:8px 0 0; color:var(--muted); font-size:15px; line-height:1.4; }
  .pub .card { width:100%; margin-top:26px; text-align:left; }
  .pub .card .big { justify-content:space-between; }
  .pub .card .big b { font-size:28px; }
  .pub .bar { height:10px; border-radius:6px; background:var(--canvas); overflow:hidden; margin-top:10px; }
  .pub .bar i { display:block; height:100%; width:33%; background:var(--teal); border-radius:6px; }
  .pub .card .hint { margin-top:8px; }
  .pub .foot { position:static; width:100%; margin-top:auto; }
  .pub .foot .hint { text-align:center; margin-top:12px; }
  .joinnote { display:flex; gap:12px; align-items:flex-start; margin-top:12px; padding:12px 14px; border-radius:16px; background:var(--teal-soft); font-size:14px; line-height:1.4; text-align:left; }
  .joinnote i { flex:none; width:36px; height:36px; border-radius:12px; background:var(--paper); color:var(--teal); display:grid; place-items:center; }
  .joinnote i svg { width:20px; height:20px; }
  .joinnote b { font-weight:800; }
  .qr { width:156px; height:156px; margin:14px auto 0; background:#fff; border-radius:16px; display:grid; place-items:center; box-shadow:inset 0 0 0 1px var(--line); }
  .qr svg { width:128px; height:128px; }
</style>
</head>
<body>
<h1>Сбор</h1>
<p class="lead">Один экран для участника и автора, меняется только нижняя карточка. Шапка отвечает на три вопроса и не больше: кто просит и через кого, сколько есть и сколько нужно, кто закрывает. Семь состояний.</p>
<div class="row" id="row"></div>
<script src="shared.js"></script>
<script>
I.qr = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4.5 4.5h6v6h-6zM13.5 4.5h6v6h-6zM4.5 13.5h6v6h-6z"/><path d="M14.2 14.2h1.8v1.8h-1.8zM17.8 14.2H19.6v1.8h-1.8zM14.2 17.8h1.8V19.6h-1.8zM17.8 17.8H19.6V19.6h-1.8z" fill="currentColor" stroke="none"/></svg>`;
function qrSvg() { let o = ""; for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) { const f = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13); const edge = f && (x % 7 === 0 || y % 7 === 0 || x === 14 || x === 20 || y === 14 || y === 20); const core = (x > 1 && x < 5 && y > 1 && y < 5) || (x > 15 && x < 19 && y > 1 && y < 5) || (x > 1 && x < 5 && y > 15 && y < 19); if (edge || core || (!f && ((x * 3 + y * 5) % 4 === 0))) o += `<rect x="${x}" y="${y}" width="1" height="1"/>`; } return `<svg viewBox="0 0 21 21" fill="var(--ink)">${o}</svg>`; }

// Header card: the path only when there is one (participant), the note only when given.
const head = (o) => `
<div class="card">
  ${o.path && o.path.length > 1 ? path(o.path) : ""}
  <div class="who"><span class="ava">${o.name[0]}</span><span class="t"><b>${o.name}</b><span>${o.sub}</span></span></div>
  ${meter(o.mine, o.others, o.goal)}
  ${o.note ? `<p class="hint">${o.note}</p>` : ""}
</div>`;

const participants = (rows, author) => `<div class="label"><span>Участники · ${rows.length}</span>${author ? "<span>Переведено</span>" : ""}</div><div class="group">${rows.map(r => row(r.n[0], r.n, r.s, author ? `<span class="amt ${r.me ? "me" : ""}">${r.a} $</span><span class="chk ${r.paid ? "on" : ""}">${I.check}</span>` : `<span class="amt ${r.me ? "me" : ""}">${r.a} $</span>`)).join("")}</div>`;
const PEOPLE = [{ n: "Олег Соколов", s: "1-е рукопожатие", a: 10, paid: true }, { n: "Юки Танака", s: "через Олег", a: 30, paid: true }, { n: "Том Беккер", s: "через Ирина", a: 20 }, { n: "Чен Вэй", s: "через Олег", a: 40 }];
const VIA = ["Вы", "Олег брат", "Мария"];
const MARIA = { name: "Мария Коваль", sub: "Разовая помощь · 2 дня назад", path: VIA, note: "Сбор закрывает Мария. Сумма может не дойти до цели." };
const AUTHOR = { name: "Анна", sub: "Разовая помощь · открыт 2 дня назад", mine: 0, others: 100, goal: 300 };

const P1 = `<div class="phone">${status()}${nav("Круг")}<div class="page notabs">
${head({ ...MARIA, mine: 0, others: 100, goal: 300 })}
<div class="card"><span class="lbl">Ваша сумма</span><div class="money">15<span class="caret"></span><small>$</small></div><p class="hint">Минимальное участие — 15 $. Можно больше.</p><div class="actions"><div class="btn primary">Участвовать</div></div></div>
${participants(PEOPLE)}
</div>${home()}</div>`;

const P2 = `<div class="phone">${status()}${nav("Круг", "", "Отказаться", "danger")}<div class="page notabs">
${head({ ...MARIA, mine: 15, others: 100, goal: 300 })}
<div class="card"><div class="joined"><div class="big"><b>15 $</b><span>вы участвуете</span></div><span class="edit">Изменить</span></div>
<div class="actions"><div class="btn primary">${I.chat}Открыть чат сбора</div></div><p class="hint">Как передать деньги, договариваются в чате. Приложение это не фиксирует.</p></div>
${participants([...PEOPLE, { n: "Анна", s: "вы", a: 15, me: true }])}
</div>${home()}</div>`;

const P3 = `<div class="phone">${status()}${nav("Круг", "", "Отказаться", "danger")}<div class="page notabs">
${head({ name: "Денис Волков", sub: "Каждые 28 дней · 3-й цикл", path: ["Вы", "Денис"], mine: 15, others: 40, goal: 100 })}
<div class="card"><div class="cycle"><i>${I.clock}</i><span><b>Новый цикл до 12 апреля.</b> Подтвердите участие, иначе 15 $ не войдут в этот цикл.</span></div>
<div class="actions"><div class="btn primary">Подтвердить 15 $</div><div class="btn secondary">Другая сумма</div></div></div>
${participants([{ n: "Ирина Соколова", s: "подтвердила", a: 20 }, { n: "Лена Мороз", s: "подтвердила", a: 20 }, { n: "Анна", s: "ждём вас", a: 15, me: true }])}
</div>${home()}</div>`;

const authorCard = `<div class="card"><div class="linkrow"><span class="t"><small>Чат сбора</small><b>t.me/+sbor-anna-2026</b></span>${I.pen}</div>
<div class="two"><div class="btn primary">${I.share}Поделиться сбором</div><div class="btn secondary">${I.qr}</div></div><p class="hint">Страница сбора публичная: имя, сумма и прогресс видны всем. Кто войдёт по ссылке, станет вашим 1-м рукопожатием.</p></div>`;

const P4 = `<div class="phone">${status()}${nav("Профиль", "Ваш сбор")}<div class="page notabs">
${head(AUTHOR)}
${authorCard}
${participants(PEOPLE, true)}
<span class="textbtn danger">Закрыть сбор</span>
</div>${home()}</div>`;

const P5 = `<div class="phone">${status()}${nav("Профиль", "Ваш сбор")}<div class="page notabs">
${head(AUTHOR)}
${authorCard}
</div>${home()}
<div class="scrim"><div class="sheet"><h3>QR сбора</h3><p class="sub">Та же публичная ссылка, что в «Поделиться».</p>
<div class="qr">${qrSvg()}</div><p class="hint" style="text-align:center;margin-top:10px">orginizer.com/sos/k9x…</p>
<div class="btn secondary" style="margin-top:16px">Скачать для печати</div><div class="btn ghost">Готово</div></div></div></div>`;

const P6 = `<div class="phone">${status()}<div class="pub">
<div class="brand"><img src="${MARK}" alt="">Social Organizer</div>
<span class="ava">А</span><h2>Анне нужна помощь</h2><p class="why">Разовая помощь · открыт 2 дня назад</p>
<div class="card"><div class="big"><b>100 $</b><span>из 300 $</span></div><div class="bar"><i></i></div><p class="hint">4 участника · деньги передают лично</p></div>
<div class="joinnote"><i>${I.add}</i><span><b>Вы станете частью круга Анны.</b> Присоединяясь, вы подтверждаете, что знаете её лично.</span></div>
<div class="foot"><div class="btn primary">Присоединиться</div><p class="hint">Дальше вход: Apple, Google, Telegram или почта.</p></div>
</div>${home()}</div>`;

const P7 = `<div class="phone">${status()}${nav("Сборы")}<div class="page notabs">
${head({ name: "Мария Коваль", sub: "Разовая помощь · закрыт 12 марта", path: VIA, mine: 20, others: 24, goal: 80 })}
${participants([{ n: "Олег брат", s: "1-е рукопожатие", a: 14 }, { n: "Тимур Алиев", s: "через Олег", a: 10 }, { n: "Анна", s: "вы", a: 20, me: true }])}
</div>${home()}</div>`;

document.getElementById("row").innerHTML = [
  section("new", P1, "<small>1</small>Участник: новая просьба", `<p>Шапка из трёх слоёв. Путь «Вы → Олег брат → Мария» отвечает на «почему я это вижу», поэтому в подписи под именем «через кого» не повторяется. Шкала «Собрано / Цель» показывает, сколько есть; сегмент «Вы» появляется, только когда вы участвуете. Одна строка под шкалой снимает ожидание гарантии.</p>
<ul><li>Рельсы стадий «Сумма · Обсуждение · Закрыт» больше нет: стадию и так показывает нижняя карточка (поле суммы, кнопка чата, итог), рельса дублировала её и занимала строку.</li><li>Поле суммы предзаполнено минимальным участием. Одно касание «Участвовать» уже даёт результат.</li><li>Таб-бара нет: это пуш-экран, назад — в Круг.</li></ul>`),
  section("joined", P2, "<small>2</small>Участник: обсуждение", `<p>После «Участвовать» нижняя карточка меняется: сумма крупно, «Изменить» рядом, главная кнопка «Открыть чат сбора». В шкале появился сегмент «Вы 15 $». Одна фраза под кнопкой говорит, что передача денег происходит в чате и приложением не фиксируется.</p>
<ul><li>«Отказаться» в правом углу шапки красным, тап поднимает лист «Отказаться от участия?» с кнопками «Отказаться» и «Остаться».</li><li>Своя строка в списке участников подсвечена бирюзой.</li></ul>`),
  section("cycle", P3, "<small>3</small>Регулярный: новый цикл", `<p>Сбор «Каждые 28 дней» в начале нового цикла. Про цикл говорит только тёплая плашка: дата, что сделать и что будет иначе. В шапке подсказки нет, чтобы не было двух фраз об одном. Две кнопки: «Подтвердить 15 $» и «Другая сумма». В списке видно, кто уже подтвердил, а кого ждут.</p>
<ul><li>Это замена нынешней карточке в уведомлениях с кнопками «Помню / Отозвать намерение».</li><li>Напоминание за 3 дня приходит пушем и строкой в ленте Круга, оба ведут сюда.</li></ul>`),
  section("author", P4, "<small>4</small>Автор", `<p>Тот же экран глазами автора, открывается из Просьбы или Профиля. Шапка ещё короче: без пути (он из одной точки) и без подсказки о закрытии, автор и так знает, что закрывает сам. Карточка действий: ссылка на чат с карандашом, «Поделиться сбором» через системный share, кнопка QR. В списке колонка «Переведено»: автор ставит отметки сам, когда получил деньги.</p>
<ul><li>Ссылка и QR ведут на публичную страницу сбора (сейчас /sos/:id). Человек с улицы присоединяется и сразу становится 1-м рукопожатием автора. Две фразы под кнопками говорят об этом прямо.</li><li>«Закрыть сбор» текстом внизу, с листом подтверждения «Закрыть сбор? Собрано 100 из 300 $».</li></ul>`),
  section("qr", P5, "<small>5</small>QR сбора", `<p>Лист с QR той же публичной ссылки: показать с экрана при встрече или скачать для печати. Короткий адрес под кодом на случай, если камера не читает.</p>`),
  section("public", P6, "<small>6</small>Публичная страница сбора", `<p>Открывается по ссылке или QR без входа (/sos/:id). Сверху вниз: кому, сколько есть, что будет, если присоединиться. Тип и давность одной строкой под именем; «4 участника · деньги передают лично» одной строкой под шкалой; способы входа одной строкой под кнопкой. Слоган бренда убран: заголовок «Анне нужна помощь» объясняет страницу сам.</p>
<ul><li>Плашка «Вы станете частью круга Анны» делает явным то, что сейчас происходит молча: <code>invite.acceptSos</code> создаёт прямую связь без подтверждения. Человек должен это прочитать до тапа.</li><li>После входа — экран Сбора в состоянии «новая просьба», а в ленте автора строка «Катя вошла по ссылке сбора».</li><li class="risk">Риск: связь без подтверждения со стороны автора — удобный вход, но и способ попасть в чужой круг по найденному QR. Автор убирает такого человека одним действием из списка участников.</li></ul>`),
  section("closed", P7, "<small>7</small>Закрыт", `<p>Открывается из «Прошлых сборов». Вся информация уже в шапке: «закрыт 12 марта» в подписи, итог в шкале «Вы 20 $ · Другие 24 $ · Цель 80 $». Отдельной карточки «Вы участвовали» нет: она повторяла шкалу. Действий нет, только список. Та же картина без действий показывается участнику, если автор закрыл сбор, пока тот был открыт у него на экране.</p>`)
].join("");
</script>
</body>
</html>

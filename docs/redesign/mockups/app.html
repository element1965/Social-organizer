<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Organizer</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas:#f3f6f4; --ink:#14211e; --muted:#5c6d68; --line:rgba(20,33,30,.16); --paper:#fff; --teal:#0d9488; --danger:#c5342c;
    --bad:#9a3b32; --on-ink:#fff;
    --d1:#14211e; --d2:#3e524c; --d3:#62756f; --note:#3e524c;
    --edge-soft:rgba(20,33,30,.28); --edge1:rgba(20,33,30,.55); --edge2:rgba(62,82,76,.58); --edge3:rgba(98,117,111,.5); --edge-dim:rgba(20,33,30,.45);
    --halo-hot:#e5f5f3; --hair:rgba(20,33,30,.08); --hair-strong:rgba(20,33,30,.1);
    --shadow-xs:rgba(20,33,30,.05); --shadow-sm:rgba(20,33,30,.06); --shadow-md:rgba(20,33,30,.08); --shadow-lg:rgba(20,33,30,.1);
    --shadow-banner:rgba(20,33,30,.16); --shadow-dialog:rgba(20,33,30,.2); --chip-line:rgba(20,33,30,.12);
    --track:rgba(20,33,30,.16); --knob-shadow:rgba(20,33,30,.18); --stage:rgba(20,33,30,.12); --scrim:rgba(20,33,30,.46);
    --tab:rgba(255,255,255,.92); --beat:rgba(255,255,255,.72); --dot:rgba(20,33,30,.2); --mark-edge:rgba(0,0,0,.1);
    --texty:0 0 0 1px rgba(0,0,0,.06), 0 1px 2px -1px rgba(0,0,0,.06), 0 2px 4px 0 rgba(0,0,0,.04);
  }
  .phone.dark {
    --canvas:#121917; --ink:#e7eeeb; --muted:#93a59f; --line:rgba(231,238,235,.14); --paper:#1c2622;
    --bad:#e08a82; --on-ink:#121917;
    --d1:#e7eeeb; --d2:#a8b8b2; --d3:#8b9c96; --note:#a8b8b2;
    --edge-soft:rgba(231,238,235,.22); --edge1:rgba(231,238,235,.55); --edge2:rgba(168,184,178,.5); --edge3:rgba(139,156,150,.45); --edge-dim:rgba(231,238,235,.4);
    --halo-hot:#1a3330; --hair:rgba(231,238,235,.1); --hair-strong:rgba(231,238,235,.14);
    --shadow-xs:rgba(0,0,0,.28); --shadow-sm:rgba(0,0,0,.32); --shadow-md:rgba(0,0,0,.36); --shadow-lg:rgba(0,0,0,.4);
    --shadow-banner:rgba(0,0,0,.5); --shadow-dialog:rgba(0,0,0,.55); --chip-line:rgba(231,238,235,.16);
    --track:rgba(231,238,235,.2); --knob-shadow:rgba(0,0,0,.45); --stage:rgba(231,238,235,.14); --scrim:rgba(0,0,0,.64);
    --tab:#1c2622; --beat:rgba(255,255,255,.08); --dot:rgba(231,238,235,.28); --mark-edge:rgba(255,255,255,.14);
    --texty:0 0 0 1px rgba(255,255,255,.1), 0 1px 2px rgba(0,0,0,.45);
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; color:var(--foreground); font-family:Manrope,"Avenir Next","Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
  .board { width:min(100%,420px); margin:0 auto; }
  .phone { width:min(100%,390px); height:760px; margin:0 auto; background:var(--canvas); color:var(--ink); border-radius:36px; overflow:hidden; position:relative; color-scheme:light; }
  .status { height:48px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 22px 8px; font-size:15px; font-weight:700; letter-spacing:-.02em; }
  .sys { display:flex; align-items:center; gap:5px; }
  .deck { position:absolute; left:0; right:0; top:48px; bottom:0; overflow:hidden; }
  .layer { position:absolute; inset:0; display:flex; flex-direction:column; background:var(--canvas); transition:transform .4s cubic-bezier(.22,.8,.24,1), opacity .26s cubic-bezier(.22,.8,.24,1); }
  .layer.leaving { pointer-events:none; }
  .layer.prep { transition:none; }
  .layer.prep.m-push { transform:translateX(100%); }
  .layer.prep.m-pop { transform:translateX(-18%); }
  .layer.prep.m-tab { opacity:0; transform:translateY(8px); }
  .layer.leaving.m-push { transform:translateX(-18%); }
  .layer.leaving.m-pop { transform:translateX(100%); }
  .layer.leaving.m-tab { opacity:0; transform:translateY(-6px); }
  .app { flex:1; min-height:0; display:flex; flex-direction:column; padding:0 18px 0; }
  .brand { display:flex; align-items:center; gap:8px; min-height:44px; flex:none; margin:0 -18px; padding:2px 18px 8px; box-shadow:inset 0 -1px 0 var(--hair); }
  .brand img { width:28px; height:28px; border-radius:8px; display:block; outline:1px solid var(--mark-edge); outline-offset:-1px; }
  .brand b { font-size:15px; font-weight:700; letter-spacing:-.02em; }
  .stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; touch-action:none; cursor:grab; user-select:none; position:relative; overflow:hidden; padding-bottom:44px; }
  .netsum { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:40px; flex:none; padding:6px 0 2px; }
  .netsum span { display:flex; flex-direction:column; align-items:flex-start; gap:1px; color:var(--muted); font-size:13px; font-weight:650; }
  .netsum .heads { color:var(--ink); font-size:15px; font-weight:700; letter-spacing:-.03em; }
  .netsum b.num { font-size:20px; letter-spacing:-.03em; }
  .netsum small, .grow small { color:var(--teal); font-size:13px; font-weight:700; letter-spacing:-.02em; }
  .recenter { min-height:32px; padding:0 8px 0 6px; border:0; border-radius:12px; background:var(--paper); color:var(--ink); box-shadow:0 6px 16px var(--shadow-lg); display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:700; }
  .recenter svg { width:16px; height:16px; display:block; }
  .recenter.away { background:var(--teal); color:#fff; }
  .stage.dragging { cursor:grabbing; }
  .stage > svg { width:100%; height:100%; overflow:visible; }
  svg text { font-family:Manrope,"Avenir Next",sans-serif; font-size:12px; font-weight:700; fill:var(--ink); text-anchor:middle; dominant-baseline:middle; paint-order:stroke; stroke:var(--canvas); stroke-width:5px; stroke-linejoin:round; }
  svg .nm { font-size:11px; dominant-baseline:auto; }
  svg .note { font-size:10px; font-weight:650; fill:var(--note); }
  svg .me text { font-size:15px; dominant-baseline:middle; }
  svg .maria, svg .maria .note { fill:var(--teal); font-size:12px; }
  .edge { fill:none; stroke:var(--edge-soft); stroke-width:1.4; stroke-linecap:round; pointer-events:none; }
  .edge.e1 { stroke:var(--edge1); stroke-width:1.8; }
  .edge.e2 { stroke:var(--edge2); stroke-width:1.5; }
  .edge.e3 { stroke:var(--edge3); stroke-width:1.2; }
  .edge.hot { stroke:var(--teal); stroke-width:2.6; }
  .edge.off { opacity:0; }
  .node { opacity:var(--fade,1); cursor:pointer; transition:opacity .5s cubic-bezier(.2,.8,.2,1), transform .55s cubic-bezier(.2,.8,.2,1); }
  .node.off { opacity:0; transform:translate(var(--dx), var(--dy)) scale(.2); pointer-events:none; }
  .node text { pointer-events:none; }
  .halo { fill:var(--canvas); }
  .node.hot .halo { fill:var(--halo-hot); }
  .stage.dragging .node, .stage.dragging .edge { transition:none; }
  .d1 { fill:var(--d1); }
  .d2 { fill:var(--d2); }
  .d3 { fill:var(--d3); }
  .me { cursor:pointer; }
  svg.focus .edge { opacity:.14; }
  svg.focus .edge.hot { opacity:1; }
  svg.focus .node { opacity:.32; }
  svg.focus .node.hot { opacity:1; }
  .h { margin:14px 0 0; font-size:32px; letter-spacing:-.04em; font-weight:700; text-wrap:balance; }
  .sheet { background:var(--paper); border-radius:22px; padding:16px; box-shadow:0 10px 28px var(--shadow-md); }
  .sheet.askcard:not(.tight), .sheet.pushcard, .sheet.addcard { border-radius:32px; }
  .sheet.sign { margin: 0 0 8px; padding: 12px 14px 14px; }
  .sheet.sign label { margin-top: 0; }
  .askcard, .pushcard, .addcard { margin-top: 16px; }
  .askcard > label:first-child, .pushcard > label:first-of-type, .addcard .sub { margin-top: 0; }
  .askcard input.money { height: 72px; margin-top: 0; padding: 0 2px; border: 0; background: transparent; font-size: 52px; }
  .askcard input.money.bad { border-bottom: 2px solid var(--bad); }
  .askcard .seg { margin-top: 4px; padding: 4px; border-radius: 16px; background: var(--canvas); gap: 4px; }
  .askcard .seg button { background: transparent; border-radius: 12px; }
  .askcard .hint { margin-top: 14px; }
  .askcard .go, .pushcard .go, .addcard .go { margin-top: 16px; }
  .pushcard .texty { width: 100%; margin-top: 10px; }
  .addacts { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .code { margin: 8px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -.03em; word-break: break-all; }
  .finder { width: 232px; height: 232px; margin: 0; position: relative; }
  .task.camera { align-items: center; justify-content: flex-start; }
  .task.camera .finder { margin-top: auto; margin-bottom: auto; }
  .task.camera .foot { align-self: stretch; margin-top: 0; }
  .finder i { position: absolute; width: 36px; height: 36px; border: 3px solid var(--teal); }
  .finder i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 16px 0 0 0; }
  .finder i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 16px 0 0; }
  .finder i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 16px; }
  .finder i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 16px 0; }
  .sheet h2 { margin:0; font-size:22px; letter-spacing:-.03em; text-wrap:balance; }
  .sub { margin:6px 0 0; color:var(--muted); font-size:14px; line-height:1.35; text-wrap:pretty; }
  .url { margin:8px 0 0; font-weight:700; font-size:15px; }
  label { display:block; margin-top:16px; font-size:13px; color:var(--muted); font-weight:600; }
  input { width:100%; height:56px; margin-top:6px; border-radius:16px; border:1px solid var(--line); background:var(--canvas); padding:0 14px; font-size:17px; }
  input.money { height:64px; font-size:28px; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  input.bad { border-color:var(--bad); animation:shake .28s ease; }
  .err { margin:8px 0 0; color:var(--bad); font-size:14px; font-weight:650; min-height:0; }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .seg button, .go, .dock button, .texty, .event, .linkrow { min-height:56px; border-radius:16px; }
  .seg button { border:0; background:var(--paper); font-weight:700; }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--on-ink); }
  .go, .dock .solid { width:100%; border:0; background:var(--teal); color:#fff; font-weight:700; font-size:17px; }
  .go { margin-top:0; }
  .dock { display:grid; grid-template-columns:1.25fr .9fr; gap:10px; margin-top:8px; }
  .dock .ghost, .texty { border:1px solid var(--line); background:var(--paper); font-weight:700; color:var(--ink); }
  .texty { border:0; box-shadow:var(--texty); }
  .nav { height:48px; flex:none; display:flex; align-items:center; margin:0 -18px; padding:0 6px; position:relative; box-shadow:inset 0 -1px 0 var(--hair-strong); }
  .nav .back { display:inline-flex; align-items:center; gap:0; border:0; background:none; color:var(--teal); font-weight:600; font-size:17px; letter-spacing:-.02em; min-height:44px; padding:0 10px 0 2px; }
  .nav .back svg { width:22px; height:22px; display:block; margin-right:-1px; }
  .navtitle { position:absolute; left:108px; right:108px; text-align:center; font-size:17px; font-weight:700; letter-spacing:-.02em; pointer-events:none; }
  .navtitle.solo { left:16px; right:16px; }
  .navleave { margin-left:auto; margin-right:2px; flex:none; min-height:44px; padding:0 4px; border:0; background:transparent; }
  .navleave span { display:inline-flex; align-items:center; min-height:32px; padding:0 12px; border-radius:11px; background:var(--danger); color:#fff; font-size:14px; font-weight:700; letter-spacing:-.02em; }
  .tabwrap { flex:none; margin:0 -18px; background:var(--tab); box-shadow:0 -1px 0 var(--hair); }
  .tabbar { display:grid; grid-template-columns:repeat(4,1fr); padding:5px 2px 0; }
  .tab { border:0; background:none; color:var(--muted); min-height:48px; padding:2px 0 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:10px; font-weight:700; letter-spacing:-.01em; }
  .tab[aria-pressed="true"] { color:var(--teal); }
  .tabbar .tab svg { width:24px; height:24px; display:block; }
  .tab .sosmark, .tab[aria-pressed="true"] .sosmark { width:24px; height:24px; border-radius:7px; background:var(--danger); color:#fff; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; letter-spacing:-.04em; line-height:1; }
  .safe { height:22px; flex:none; display:flex; align-items:center; justify-content:center; }
  .safe i { width:128px; height:5px; border-radius:100px; background:var(--ink); display:block; }
  .iconbtn { display:flex; align-items:center; gap:12px; width:100%; padding:0 16px 0 14px; text-align:left; }
  .iconbtn svg { width:22px; height:22px; flex:none; color:var(--teal); }
  .go.withico { display:flex; align-items:center; justify-content:center; gap:8px; }
  .go.withico svg { width:18px; height:18px; flex:none; }
  .task { flex:1; min-height:0; display:flex; flex-direction:column; }
  .fields { flex:1; min-height:0; overflow:auto; }
  .foot { margin-top:auto; display:flex; flex-direction:column; gap:10px; padding-top:12px; }
  .pair { display:grid; grid-template-columns:.78fr 1.22fr; gap:10px; }
  .foot .texty, .foot .go, .foot .linkrow { width:100%; }
  .hint { margin:0 0 2px; color:var(--muted); font-size:14px; line-height:1.35; text-wrap:pretty; }
  .inbox { display:flex; flex-direction:column; gap:8px; margin-top:8px; margin-bottom:10px; flex:none; }
  .event { width:100%; min-height:64px; border:0; border-radius:22px; background:var(--paper); text-align:left; padding:10px 12px 10px 10px; box-shadow:0 8px 22px var(--shadow-sm); display:flex; flex-direction:row; align-items:center; gap:10px; }
  .event .mark { width:36px; height:36px; border-radius:12px; background:var(--canvas); color:var(--ink); display:grid; place-items:center; flex:none; }
  .event .mark svg { width:20px; height:20px; display:block; }
  .event .ev { display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
  .event .fwd { width:18px; height:18px; color:var(--muted); flex:none; }
  .event.pending { visibility:hidden; pointer-events:none; }
  .event.enter { animation:card-in .4s cubic-bezier(.22,.8,.24,1) both; }
  @keyframes card-in { from { opacity:0; transform:translateY(-12px); filter:blur(4px); } }
  .invite.task, .intro.task { justify-content:flex-start; padding-top:0; }
  .event b { font-size:16px; letter-spacing:-.02em; }
  .event .ev span { color:var(--muted); font-size:13px; font-weight:600; }
  .linkrow { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; margin-top:14px; padding:10px 14px 10px 16px; min-height:64px; background:var(--paper); color:var(--ink); text-align:left; box-shadow:0 8px 22px var(--shadow-sm); }
  .linkrow .linkcopy { display:flex; flex-direction:column; align-items:flex-start; gap:1px; min-width:0; }
  .linkrow small { color:var(--muted); font-size:12px; font-weight:650; line-height:1.2; }
  .linkrow b { font-size:17px; font-weight:700; letter-spacing:-.02em; line-height:1.2; }
  .linkrow svg { width:18px; height:18px; flex:none; color:var(--teal); }
  .pushcard .linkrow { background:var(--canvas); box-shadow:none; }
  .steps { list-style:none; margin:22px 0 0; padding:0; display:flex; flex-direction:column; gap:4px; }
  .steps li { display:grid; grid-template-columns:36px 1fr; gap:12px; align-items:center; min-height:52px; font-size:16px; font-weight:650; line-height:1.3; }
  .steps i { width:32px; height:32px; border-radius:50%; background:var(--ink); color:var(--on-ink); display:grid; place-items:center; font-style:normal; font-size:14px; }
  .rings { position:absolute; left:0; right:0; bottom:6px; z-index:2; display:flex; align-items:center; justify-content:center; gap:8px; height:32px; margin:0; pointer-events:none; }
  .ringchips { display:contents; }
  .rings .recenter { position:static; height:32px; margin:0; pointer-events:auto; background:var(--paper); color:var(--ink); box-shadow:0 6px 16px var(--shadow-lg); }
  .rings .recenter.away { background:var(--teal); color:#fff; }
  .rings button { height:32px; min-height:32px; flex:none; padding:0 10px; border:0; border-radius:12px; background:var(--paper); color:var(--muted); font-weight:700; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:4px; pointer-events:auto; box-shadow:0 6px 16px var(--shadow-md), inset 0 0 0 1px var(--chip-line); }
  .rings button b { font-size:16px; font-weight:700; letter-spacing:-.03em; line-height:1; }
  .rings button span { font-size:13px; font-weight:650; letter-spacing:-.02em; line-height:1; }
  .rings i { width:8px; height:8px; border-radius:50%; background:transparent; box-shadow:inset 0 0 0 1.5px currentColor; display:block; flex:none; }
  .rings button[aria-pressed="true"].r1 { color:var(--d1); box-shadow:0 6px 16px var(--shadow-md), inset 0 0 0 1.5px var(--d1); }
  .rings button[aria-pressed="true"].r2 { color:var(--d2); box-shadow:0 6px 16px var(--shadow-md), inset 0 0 0 1.5px var(--d2); }
  .rings button[aria-pressed="true"].r3 { color:var(--d3); box-shadow:0 6px 16px var(--shadow-md), inset 0 0 0 1.5px var(--d3); }
  .rings button[aria-pressed="true"] i { background:currentColor; box-shadow:none; }
  .pathbox { margin:6px 0 0; flex:none; }
  .pathfig { width:100%; height:auto; overflow:visible; display:block; }
  .pathfig .route { fill:none; stroke:var(--teal); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
  .pathfig .pnode { opacity:1; }
  .task.scroll { overflow:auto; padding:12px 0 16px; }
  .task.scroll > * { flex: none; }
  .task.profile { padding: 2px 0 36px; }
  .task.profile .glabel { margin-top: 10px; }
  .task.profile .group { margin-top: 4px; }
  .task.profile .group.notes, .task.profile .group.theme { margin-top: 10px; }
  .group { background:var(--paper); border-radius:16px; margin-top:8px; overflow:hidden; box-shadow:0 8px 22px var(--shadow-xs); }
  .glabel { margin:18px 4px 0; color:var(--muted); font-size:13px; font-weight:650; }
  .group.notes { margin-top:26px; }
  .fold .fwd { transform:rotate(90deg); transition:transform .2s cubic-bezier(.2,.8,.2,1); }
  .fold[aria-expanded="true"] .fwd { transform:rotate(-90deg); }
  .account-end { margin: 36px 0 0; }
  .row { width:100%; min-height:56px; padding:0 16px; border:0; background:transparent; display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:left; font-weight:650; position:relative; }
  label.row { margin:0; font-size:inherit; color:inherit; }
  .row + .row { box-shadow:inset 0 1px 0 var(--line); }
  .whoami { justify-content:flex-start; gap:12px; }
  .whoami img { width:44px; height:44px; border-radius:14px; outline:1px solid var(--mark-edge); outline-offset:-1px; }
  .whoami b { font-size:18px; letter-spacing:-.03em; }
  .whoami .fwd { margin-left:auto; }
  .grow { display:flex; flex-direction:column; align-items:flex-end; line-height:1.15; font-size:16px; }
  .num { font-variant-numeric:tabular-nums; font-weight:700; letter-spacing:-.03em; }
  .tail { display:flex; align-items:center; gap:4px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .tail .num { color:var(--ink); }
  .row .fwd { width:18px; height:18px; color:var(--muted); flex:none; }
  .row input { position:absolute; opacity:0; width:1px; height:1px; margin:0; }
  .switch { width:51px; height:31px; border-radius:16px; background:var(--track); display:block; flex:none; position:relative; transition:background .2s cubic-bezier(.2,.8,.2,1); }
  .switch::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 6px var(--knob-shadow); transition:transform .2s cubic-bezier(.2,.8,.2,1); }
  .row input:checked + .switch { background:var(--teal); }
  .row input:checked + .switch::after { transform:translateX(20px); }
  .row input:focus-visible + .switch { outline:2px solid var(--teal); outline-offset:2px; }
  .empty { margin-top:10px; }
  .stages { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .stages div { min-width:0; }
  .stages i { display:block; height:4px; border-radius:3px; background:var(--stage); }
  .stages span { display:block; margin-top:6px; font-size:12px; font-weight:700; color:var(--muted); }
  .stages .on i { background:var(--teal); }

function personById(id) {

  if (typeof id === "string" && id.charAt(0) === "f") {
    const i = Number(id.slice(1));
    const p = FRIENDS[i];
    if (!p) return null;
    return { id, label: p.label, account: p.account, depth: 1, parent: "me" };
  }
  const n = EXTRA.find((item) => item.key === id);
  if (!n) return null;
  return { id: n.key, label: n.label, account: n.account, depth: n.depth, parent: n.parent };
}
function chain(id) {
  const out = [];
  let cur = personById(id);
  let guard = 0;
  while (cur && guard++ < 6) {
    out.unshift(cur);
    cur = cur.parent ? personById(cur.parent) : null;
  }
  return out;
}

function meter(you, others, goal) {
  const g = Math.max(1, goal);
  const yw = Math.min(100, Math.max(0, you) / g * 100);
  const ow = Math.min(100 - yw, Math.max(0, others) / g * 100);
  return `<div class="meter" aria-hidden="true"><i class="mine" style="width:${yw.toFixed(1)}%"></i><i class="rest" style="width:${ow.toFixed(1)}%"></i></div><div class="meterkey"><span><i class="mine"></i>Вы ${you} $</span><span><i class="rest"></i>Другие ${others} $</span><b>Цель ${goal} $</b></div>`;
}

}
function pathFig(id) {
  const nodes = chain(id);
  const w = 324;
  const h = 78;
  const y = 28;
  const xs = nodes.map((_, i) => nodes.length === 1 ? w / 2 : 24 + i * ((w - 48) / (nodes.length - 1)));
  const d = xs.map((x, i) => `${i ? "L" : "M"}${x.toFixed(1)} ${y}`).join(" ");
  const dots = nodes.map((p, i) => {
    const last = i === nodes.length - 1;
    const fill = p.depth <= 1 ? "var(--d1)" : p.depth === 2 ? "var(--d2)" : "var(--d3)";
    const r = last ? 8 : 5.5;
    const ring = last ? `<circle cx="${xs[i].toFixed(1)}" cy="${y}" r="12" fill="none" stroke="var(--teal)" stroke-width="1.8"/>` : "";
    const name = nodes.length > 3 ? labelParts(p)[0] : p.label;
    return `<g class="pnode" style="animation-delay:${(0.08 + i * 0.1).toFixed(2)}s">${ring}<circle cx="${xs[i].toFixed(1)}" cy="${y}" r="${r}" fill="${fill}"/><text x="${xs[i].toFixed(1)}" y="62">${esc(name)}</text></g>`;
  }).join("");
  return `<div class="pathbox"><svg class="pathfig" viewBox="0 0 ${w} ${h}" role="img" aria-label="Путь"><path class="route" d="${d}"/>${dots}</svg></div>`;
}

function closeMark(raised, goal) {
  const g = Math.max(1, Number(goal) || 1);
  const got = Math.max(0, Number(raised) || 0);
  const full = got >= g;
  const len = 62.832;
  const part = Math.min(len, len * got / g);
  const gap = Math.max(0, len - part);
  const track = full ? "" : `<circle cx="16" cy="16" r="10" fill="none" stroke="var(--line)" stroke-width="2"/>`;
  const ring = full
    ? `<circle cx="16" cy="16" r="10" fill="none" stroke="var(--teal)" stroke-width="2"/><circle cx="16" cy="16" r="2.4" fill="var(--teal)"/>`
    : `<circle cx="16" cy="16" r="10" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-dasharray="${part.toFixed(1)} ${gap.toFixed(1)}" transform="rotate(-90 16 16)"/>`;
  return `<svg viewBox="0 0 32 32" width="28" height="28" role="img" aria-label="${full ? "До цели" : "Раньше цели"}">${track}${ring}</svg>`;
}

function qr() {
  let s = "";
  for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {
    const f = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13);
    const edge = f && (x % 7 === 0 || y % 7 === 0 || x === 14 || x === 20 || y === 14 || y === 20);
    const core = (x > 1 && x < 5 && y > 1 && y < 5) || (x > 15 && x < 19 && y > 1 && y < 5) || (x > 1 && x < 5 && y > 15 && y < 19);
    if (edge || core || (!f && ((x * 3 + y * 5) % 4 === 0))) s += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return s;
}

    zoom = z;
  };

    cancelAnimationFrame(panRAF);

    }

    const v = viewPoint(mid.x, mid.y);
    spin = null;
    pinch = {
      dist: Math.hypot(hands[0].x - hands[1].x, hands[0].y - hands[1].y) || 1,

      const v = viewPoint(mid.x, mid.y);
      spin = null;
      pinch = {
        dist: Math.hypot(hands[0].x - hands[1].x, hands[0].y - hands[1].y) || 1,
        zoom,
        anchor: contentAt(v, zoom, panX, panY)
      };

    }

    }

    if (spun > 6) { spun = 0; return; }
    const node = e.target.closest(".node");
    if (node && screen === "home") {
      who = node.dataset.id;
      personFrom = "home";

  });
}
function statusHTML() {

}
function layerHTML() {

}
function overlayHTML() {

}
function draw(first) {
  phone.classList.toggle("dark", dark);
  const dir = motion;
  motion = "";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const current = phone.querySelector(".layer:not(.leaving)");
  if (first || !dir || reduce || !current) {
    phone.innerHTML = `${statusHTML()}<div class="deck"><div class="layer">${layerHTML()}</div></div>${overlayHTML()}`;
  } else {
    const motionClass = dir === "push" ? "m-push" : dir === "pop" ? "m-pop" : "m-tab";
    current.classList.remove("prep");
    current.classList.add("leaving", motionClass);
    current.setAttribute("inert", "");
    current.style.zIndex = dir === "pop" ? "2" : "1";
    const next = document.createElement("div");
    next.className = "layer prep " + motionClass;
    next.style.zIndex = dir === "pop" ? "1" : "2";
    next.innerHTML = layerHTML();
    current.after(next);
    phone.querySelectorAll(":scope > .scrim, :scope > .banner").forEach((node) => node.remove());
    const extra = document.createElement("template");
    extra.innerHTML = overlayHTML();
    phone.append(extra.content);
    void next.offsetWidth;
    next.classList.remove("prep");
    let removed = false;
    const done = () => {
      if (removed || !current.isConnected) return;
      removed = true;
      current.remove();
    };
    current.addEventListener("transitionend", (event) => { if (event.target === current) done(); });
    setTimeout(done, 560);
  }
  bind();
}
function bind() {

  const bannerBtn = pick("#banner");

  };

    phone.classList.toggle("dark", dark);
  };
  const notesBtn = pick("#notes");
  if (notesBtn) notesBtn.onclick = () => { notesOpen = !notesOpen; draw(); };

    const notes = pick(".group.notes");

      if (delta > 0) scroller.scrollTop += delta + 6;

  }

  const deleteScrim = pick("#delete-scrim");
  if (deleteScrim) deleteScrim.addEventListener("click", (e) => {
    if (e.target !== deleteScrim) return;
    confirmDelete = false;
    draw();
  });
  const deleteNo = pick("#delete-no");
  if (deleteNo) deleteNo.onclick = () => { confirmDelete = false; draw(); };
  const deleteYes = pick("#delete-yes");
  if (deleteYes) deleteYes.onclick = () => { confirmDelete = false; draw(); };
  bindStage();
  const onceBtn = pick("#once");
  const monthBtn = pick("#month");
  const need = pick("#need");
  const url = pick("#url");
  if (need) need.oninput = () => { amount = need.value; if (bad === "sum") { bad = ""; draw(); } };
  if (url) url.oninput = () => { link = url.value; if (bad === "link") { bad = ""; draw(); } };
  if (onceBtn) onceBtn.onclick = () => { once = true; draw(); };
  if (monthBtn) monthBtn.onclick = () => { once = false; draw(); };
  const send = pick("#send");
  if (send) send.onclick = () => {
    const sum = Number(String(amount).replace(/\s/g, ""));
    if (!link.trim()) { bad = "link"; draw(); return; }
    if (!sum || sum < 10) { bad = "sum"; draw(); return; }
    bad = "";
    leaveTo("home");
  };
  const pledge = pick("#pledge");
  if (pledge) pledge.oninput = () => {
    pledgeDraft = pledge.value;
    if (!draftBad) return;
    draftBad = false;
    pledge.classList.remove("bad");
    const err = pledge.parentElement.querySelector(".err");
    if (err) err.textContent = "";
  };
  const commitPledge = () => {
    const field = pick("#pledge");
    const sum = Number(String(field ? field.value : "").replace(/\s/g, "").replace(",", "."));
    if (!sum || sum < 1) {
      draftBad = true;
      pledgeDraft = field ? field.value : "";
      draw();
      return;
    }
    mine[caseId] = sum;
    pledgeDraft = null;
    draftBad = false;
    draw();
  };
  const join = pick("#join");
  if (join) join.onclick = commitPledge;

    draw();

  if (refuse) refuse.onclick = () => {

    leaveTo("home");

    if (err) err.textContent = "";
  };

  if (seedSave) seedSave.onclick = () => {
    const field = pick("#seed-stake");

    stakeBad = false;

    leaveTo("home");
  };
  const seedStake = pick("#seed-stake");
  if (seedStake) seedStake.oninput = () => {
    stake = seedStake.value;
    if (!stakeBad) return;
    stakeBad = false;

    const err = seedStake.parentElement.querySelector(".err");

    const sum = Number(String(stakeInput.value).replace(/\s/g, "").replace(",", "."));

  });

  });
  const filmNext = pick("#film-next");

    draw();

    showPush = false;
    draw();
  });
  const yes = pick("#yes");
